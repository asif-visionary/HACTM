# HACTM Network Dataset Schema Mappings
# Phase 2 — Network Security Agent
# Maps raw dataset column names to canonical NetworkEvent schema fields.

datasets:
  # Canadian Institute for Cybersecurity IDS 2017
  cic_ids2017:
    timestamp: "Timestamp"
    src_ip: "Source IP"
    dst_ip: "Destination IP"
    src_port: "Source Port"
    dst_port: "Destination Port"
    protocol: "Protocol"
    duration: "Flow Duration"
    flow_bytes: "Total Length of Fwd Packets"
    flow_packets: "Total Fwd Packets"
    forward_bytes: "Total Length of Fwd Packets"
    backward_bytes: "Total Length of Bwd Packets"
    forward_packets: "Total Fwd Packets"
    backward_packets: "Total Backward Packets"
    flow_rate: "Flow Bytes/s"
    packet_rate: "Flow Packets/s"
    tcp_flags: "FIN Flag Count"
    label: "Label"

  # Communications Security Establishment & CIC IDS 2018
  cse_cic_ids2018:
    timestamp: "Timestamp"
    src_ip: "Src IP"
    dst_ip: "Dst IP"
    src_port: "Src Port"
    dst_port: "Dst Port"
    protocol: "Protocol"
    duration: "Flow Duration"
    flow_bytes: "TotLen Fwd Pkts"
    flow_packets: "Tot Fwd Pkts"
    forward_bytes: "TotLen Fwd Pkts"
    backward_bytes: "TotLen Bwd Pkts"
    forward_packets: "Tot Fwd Pkts"
    backward_packets: "Tot Bwd Pkts"
    flow_rate: "Flow Byts/s"
    packet_rate: "Flow Pkts/s"
    label: "Label"

  # University of New South Wales NB15
  unsw_nb15:
    timestamp: "stime"
    src_ip: "srcip"
    dst_ip: "dstip"
    src_port: "sport"
    dst_port: "dsport"
    protocol: "proto"
    duration: "dur"
    flow_bytes: "sbytes"
    flow_packets: "Spkts"
    forward_bytes: "sbytes"
    backward_bytes: "dbytes"
    forward_packets: "Spkts"
    backward_packets: "Dpkts"
    flow_rate: "sload"
    packet_rate: "rate"
    connection_state: "state"
    label: "attack_cat"

  # BoT-IoT Dataset (IoT network botnet telemetry)
  bot_iot:
    timestamp: "stime"
    src_ip: "saddr"
    dst_ip: "daddr"
    src_port: "sport"
    dst_port: "dport"
    protocol: "proto"
    duration: "dur"
    flow_bytes: "bytes"
    flow_packets: "pkts"
    forward_bytes: "sbytes"
    backward_bytes: "dbytes"
    forward_packets: "spkts"
    backward_packets: "dpkts"
    flow_rate: "rate"
    label: "category"

  # ToN-IoT Telemetry Dataset
  ton_iot:
    timestamp: "ts"
    src_ip: "src_ip"
    dst_ip: "dst_ip"
    src_port: "src_port"
    dst_port: "dst_port"
    protocol: "proto"
    duration: "duration"
    flow_bytes: "src_bytes"
    flow_packets: "src_pkts"
    forward_bytes: "src_bytes"
    backward_bytes: "dst_bytes"
    forward_packets: "src_pkts"
    backward_packets: "dst_pkts"
    connection_state: "conn_state"
    label: "type"

  # Generic Canonical Schema (direct match)
  canonical:
    timestamp: "timestamp"
    src_ip: "src_ip"
    dst_ip: "dst_ip"
    src_port: "src_port"
    dst_port: "dst_port"
    protocol: "protocol"
    duration: "duration"
    flow_bytes: "flow_bytes"
    flow_packets: "flow_packets"
    forward_bytes: "forward_bytes"
    backward_bytes: "backward_bytes"
    forward_packets: "forward_packets"
    backward_packets: "backward_packets"
    flow_rate: "flow_rate"
    packet_rate: "packet_rate"
    tcp_flags: "tcp_flags"
    connection_state: "connection_state"
    label: "label"
